<script>
(function(){
  var msg=document.getElementById('msg');
  function fail(){ msg.textContent='This link is incomplete. Please open the full link you were sent.'; }
  function bytes(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; var bin=atob(s), out=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }
  var k=location.hash.slice(1), key, raw;
  if(!k || !window.crypto || !crypto.subtle){ fail(); return; }
  try { key=bytes(k); raw=bytes(document.getElementById('d').textContent.trim()); } catch(e){ fail(); return; }
  crypto.subtle.importKey('raw', key, {name:'AES-GCM'}, false, ['decrypt'])
    .then(function(ck){ return crypto.subtle.decrypt({name:'AES-GCM', iv: raw.slice(0,12)}, ck, raw.slice(12)); })
    .then(function(pt){ var html=new TextDecoder().decode(pt); function show(){ document.open(); document.write(html); document.close(); } if(document.readyState==='complete') show(); else window.addEventListener('load', show); })
    .catch(fail);
})();
</script>
